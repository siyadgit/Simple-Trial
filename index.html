
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Fruit Catcher</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top,#182b55,#080b1c 70%);
  color: #fff;
  font-family: 'Arial',sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin: 20px 0 10px;
  font-size: 32px;
  color: #00f5ff;
  text-shadow: 0 0 10px #00f5ff,0 0 25px #008cff;
  letter-spacing: 3px;
}

#info {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 15px;
}

#info span {
  background: #111b35;
  border: 1px solid #00eaff;
  padding: 10px 17px;
  border-radius: 12px;
  color: #fff;
  box-shadow: 0 0 12px #00eaff44;
  font-size: 15px;
}

#info b { color: #ffe600; }

canvas {
  display: block;
  margin: auto;
  background: linear-gradient(180deg,#101a38,#080b1d);
  border: 2px solid #00f5ff;
  border-radius: 15px;
  max-width: 95vw;
  box-shadow: 0 0 15px #00eaff,
              0 0 35px #0055ff55;
  touch-action: none;
}

#hint {
  color: #00eaff;
  font-size: 13px;
  letter-spacing: 1px;
}

#start {
  position: fixed;
  inset: 0;
  background: #030713dd;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(7px);
}

.panel {
  background: linear-gradient(145deg,#17264c,#0a1028);
  padding: 35px 25px;
  border-radius: 22px;
  width: 85%;
  max-width: 350px;
  border: 2px solid #00eaff;
  box-shadow: 0 0 20px #00eaff,
              inset 0 0 20px #0055ff33;
}

.panel h1 {
  font-size: 25px;
}

.panel p {
  color: #c5d8ff;
  line-height: 1.8;
}

button {
  background: linear-gradient(90deg,#00eaff,#008cff);
  color: #050b20;
  border: none;
  padding: 14px 30px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #00eaff;
  transition: .2s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px #00eaff;
}

@media(max-height:700px) {
  h1 { margin: 8px; font-size: 25px; }
  canvas { max-height: 68vh; width: auto; }
  #info { margin: 6px; }
}
</style>
</head>

<body>

<h1>⚡ NEON FRUIT CATCHER</h1>

<div id="info">
  <span>⭐ SCORE: <b id="score">0</b></span>
  <span>❤️ LIVES: <b id="lives">3</b></span>
  <span>🏆 BEST: <b id="best">0</b></span>
</div>

<canvas id="game" width="400" height="550"></canvas>

<p id="hint">◀ ARROW KEYS ▶ OR DRAG TO MOVE</p>

<div id="start">
  <div class="panel">
    <h1 id="message">⚡ READY PLAYER?</h1>
    <p>
      🍓 Catch the falling fruits!<br>
      💣 Avoid dangerous bombs!<br>
      ⭐ Collect points and beat your record!
    </p>
    <button id="play">START GAME 🚀</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("start");
const playBtn = document.getElementById("play");

let score=0, lives=3, best=Number(localStorage.getItem("fruitBest"))||0;
let objects=[],particles=[],running=false,frame=0,keys={};

const basket={x:170,y:490,w:65,h:35};
bestEl.textContent=best;

function startGame(){
  score=0;
  lives=3;
  frame=0;
  objects=[];
  particles=[];
  basket.x=170;
  running=true;
  scoreEl.textContent=0;
  livesEl.textContent=3;
  overlay.style.display="none";
  requestAnimationFrame(loop);
}

playBtn.onclick=startGame;

function spawn(){
  const bomb=Math.random()<.18;
  objects.push({
    x:20+Math.random()*360,
    y:-30,
    speed:2+Math.random()*2+score*.025,
    emoji:bomb?"💣":["🍎","🍊","🍉","🍓","🍇","🍍"][Math.floor(Math.random()*6)],
    bomb
  });
}

function drawBasket(){
  ctx.save();
  ctx.shadowColor="#00f5ff";
  ctx.shadowBlur=25;
  ctx.font="48px Arial";
  ctx.textAlign="center";
  ctx.fillText("🧺",basket.x+basket.w/2,basket.y+35);
  ctx.restore();
}

function createParticles(x,y,color){
  for(let i=0;i<12;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:30,
      color
    });
  }
}

function updateParticles(){
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    ctx.save();
    ctx.globalAlpha=p.life/30;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=12;
    ctx.fillRect(p.x,p.y,5,5);
    ctx.restore();
  });
  particles=particles.filter(p=>p.life>0);
}

function endGame(){
  running=false;

  if(score>best){
    best=score;
    localStorage.setItem("fruitBest",best);
    bestEl.textContent=best;
  }

  document.getElementById("message").textContent="💥 GAME OVER!";
  overlay.querySelector("p").innerHTML=
    `⭐ SCORE: <b>${score}</b><br>
     🏆 BEST: <b>${best}</b><br>
     Ready for another round?`;

  playBtn.textContent="PLAY AGAIN 🔄";
  overlay.style.display="flex";
}

function loop(){
  if(!running)return;

  ctx.clearRect(0,0,400,550);
  frame++;

  // Neon stars
  for(let i=0;i<35;i++){
    let x=(i*73)%400;
    let y=(i*137+frame*.5)%550;
    ctx.fillStyle="#00eaff";
    ctx.globalAlpha=.5+Math.sin(frame*.05+i)*.3;
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;

  // Neon floor lines
  ctx.strokeStyle="#174b77";
  ctx.lineWidth=1;
  for(let y=100;y<550;y+=90){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(400,y);
    ctx.stroke();
  }

  // Movement
  if(keys.ArrowLeft||keys.a)basket.x-=6;
  if(keys.ArrowRight||keys.d)basket.x+=6;
  basket.x=Math.max(0,Math.min(335,basket.x));

  // Spawn fruits
  if(frame%Math.max(18,55-score*.3)===0)spawn();

  // Falling objects
  objects.forEach((o,index)=>{
    o.y+=o.speed;

    ctx.save();
    ctx.font="32px Arial";
    ctx.textAlign="center";
    ctx.shadowColor=o.bomb?"#ff1744":"#00f5ff";
    ctx.shadowBlur=18;
    ctx.fillText(o.emoji,o.x,o.y);
    ctx.restore();

    if(o.y>basket.y&&o.y<basket.y+35&&
       o.x>basket.x-5&&o.x<basket.x+basket.w+5){

      if(o.bomb){
        lives--;
        livesEl.textContent=lives;
        createParticles(o.x,o.y,"#ff1744");
      }else{
        score+=10;
        scoreEl.textContent=score;
        createParticles(o.x,o.y,"#ffe600");
      }

      objects.splice(index,1);
    }
    else if(o.y>570){
      if(!o.bomb){
        lives--;
        livesEl.textContent=lives;
      }
      objects.splice(index,1);
    }
  });

  drawBasket();
  updateParticles();

  if(lives<=0){
    endGame();
    return;
  }

  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});

document.addEventListener("keyup",e=>keys[e.key]=false);

// Mouse and touch
function moveBasket(e){
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*400/rect.width;
  basket.x=Math.max(0,Math.min(335,x-basket.w/2));
}

canvas.addEventListener("pointerdown",moveBasket);
canvas.addEventListener("pointermove",e=>{
  if(e.buttons||e.pointerType==="touch")moveBasket(e);
});
</script>

</body>
</html>
