
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Catcher 00 🍉</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(135deg,#15152e,#292957);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}
h1 { margin: 15px 0 5px; }
#info {
  display: flex;
  justify-content: center;
  gap: 30px;
  font-size: 19px;
  margin: 12px;
}
canvas {
  display: block;
  margin: auto;
  background: linear-gradient(#25254d,#101027);
  border: 3px solid #7777bb;
  border-radius: 15px;
  max-width: 95vw;
  touch-action: none;
}
#start {
  position: fixed;
  inset: 0;
  background: #101027dd;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel {
  background: #292957;
  padding: 30px;
  border-radius: 20px;
  width: 85%;
  max-width: 350px;
  box-shadow: 0 0 30px #7777bb55;
}
button {
  background: #ffcc33;
  color: #222;
  border: 0;
  padding: 14px 30px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
p { color: #ccc; line-height: 1.5; }
#hint { color: #aaa; font-size: 13px; }
</style>
</head>
<body>

<h1>🍉 Fruit Catcher</h1>

<div id="info">
  <span>⭐ Score: <b id="score">0</b></span>
  <span>❤️ Lives: <b id="lives">3</b></span>
  <span>🏆 Best: <b id="best">0</b></span>
</div>

<canvas id="game" width="400" height="550"></canvas>
<p id="hint">Use ← → keys or drag your finger to move the basket!</p>

<div id="start">
  <div class="panel">
    <h1 id="message">🍓 Catch the Fruits!</h1>
    <p>Catch falling fruits to earn points.<br>
    Avoid the bombs 💣!<br>
    How high can you score?</p>
    <button id="play">START GAME 🚀</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("start");
const playBtn = document.getElementById("play");

let score = 0;
let lives = 3;
let best = Number(localStorage.getItem("fruitBest")) || 0;
let objects = [];
let particles = [];
let running = false;
let frame = 0;
let keys = {};
let spawnRate = 55;

const basket = { x: 170, y: 490, w: 65, h: 35 };

bestEl.textContent = best;

function startGame() {
  score = 0;
  lives = 3;
  frame = 0;
  spawnRate = 55;
  objects = [];
  particles = [];
  basket.x = 170;
  running = true;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  overlay.style.display = "none";
  requestAnimationFrame(loop);
}

playBtn.onclick = startGame;

function spawn() {
  const bomb = Math.random() < 0.18;
  objects.push({
    x: 20 + Math.random() * 360,
    y: -30,
    speed: 2 + Math.random() * 2 + score * 0.025,
    emoji: bomb ? "💣" :
      ["🍎","🍊","🍉","🍓","🍇","🍍"][Math.floor(Math.random()*6)],
    bomb
  });
}

function drawBasket() {
  ctx.font = "48px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🧺", basket.x + basket.w/2, basket.y + 35);
}

function createParticles(x,y,color) {
  for(let i=0;i<8;i++) {
    particles.push({
      x,y,
      vx:(Math.random()-.5)*6,
      vy:(Math.random()-.5)*6,
      life:25,
      color
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life/25;
    ctx.fillRect(p.x,p.y,5,5);
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p=>p.life>0);
}

function endGame() {
  running = false;
  if(score > best) {
    best = score;
    localStorage.setItem("fruitBest",best);
    bestEl.textContent = best;
  }
  document.getElementById("message").textContent =
    "💥 Game Over!";
  overlay.querySelector("p").innerHTML =
    `Your score: <b>${score}</b><br>Best score: <b>${best}</b><br>Try again and beat your record!`;
  playBtn.textContent = "PLAY AGAIN 🔄";
  overlay.style.display = "flex";
}

function loop() {
  if(!running) return;

  ctx.clearRect(0,0,400,550);
  frame++;

  // Background stars
  ctx.fillStyle = "#ffffff";
  for(let i=0;i<25;i++) {
    let x = (i*73)%400;
    let y = (i*137 + frame*.4)%550;
    ctx.globalAlpha = .35;
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha = 1;

  // Movement
  if(keys.ArrowLeft || keys.a) basket.x -= 6;
  if(keys.ArrowRight || keys.d) basket.x += 6;
  basket.x = Math.max(0,Math.min(335,basket.x));

  // Spawn objects
  if(frame % Math.max(18,spawnRate-score*.3) === 0) spawn();

  // Objects
  objects.forEach((o,index) => {
    o.y += o.speed;
    ctx.font = "32px Arial";
    ctx.textAlign = "center";
    ctx.fillText(o.emoji,o.x,o.y);

    if(o.y > basket.y && o.y < basket.y+35 &&
       o.x > basket.x-5 && o.x < basket.x+basket.w+5) {

      if(o.bomb) {
        lives--;
        livesEl.textContent = lives;
        createParticles(o.x,o.y,"#ff4444");
      } else {
        score += 10;
        scoreEl.textContent = score;
        createParticles(o.x,o.y,"#ffdd44");
      }
      objects.splice(index,1);
    } else if(o.y > 570) {
      if(!o.bomb) {
        lives--;
        livesEl.textContent = lives;
      }
      objects.splice(index,1);
    }
  });

  drawBasket();
  updateParticles();

  if(lives <= 0) {
    endGame();
    return;
  }

  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener("keydown",e => {
  keys[e.key] = true;
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))
    e.preventDefault();
});
document.addEventListener("keyup",e => keys[e.key] = false);

// Mouse and touch controls
function moveBasket(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left)*400/rect.width;
  basket.x = Math.max(0,Math.min(335,x-basket.w/2));
}
canvas.addEventListener("pointerdown",moveBasket);
canvas.addEventListener("pointermove",e => {
  if(e.buttons || e.pointerType==="touch") moveBasket(e);
});
</script>
</body>
</html>
